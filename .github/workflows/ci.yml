# https://docs.github.com/en/actions

name: "CI"

on: # yamllint disable-line rule:truthy
  push:
    paths-ignore:
      - "README.md"
      - "LICENSE.md"
      - ".editorconfig"
    branches: ["main"]
  pull_request:
    paths-ignore:
      - "README.md"
      - "LICENSE.md"
      - ".editorconfig"
    branches: ["main"]

permissions:
  contents: "read"

jobs:
  test:
    runs-on: "ubuntu-latest"
    strategy:
      max-parallel: 2
      fail-fast: false
      matrix:
        php-version: [
          "8.2",
          "8.3",
          "8.4",
          "8.5",
        ]
        composer-param: [
          "update --no-progress --prefer-dist --prefer-lowest",
          "update --no-progress --prefer-dist"
        ]
        experimental: [false]
    name: "PHP ${{ matrix.php-version }} test"
    steps:
      - name: "Check if PHP ${{ matrix.php-version }} is supported"
        if: "matrix.experimental == true"
        run: "echo 'PHP ${{ matrix.php-version }} is experimental'"
      - name: "checkout project"
        uses: "actions/checkout@v7"

      - name: "Setup PHP"
        uses: "shivammathur/setup-php@v2"
        with:
          php-version: "${{ matrix.php-version }}"
          tools: "composer:v2"
          # needed by PHPUnit code coverage
          coverage: "pcov"

      - name: "Set up problem matchers for PHP"
        run: "echo \"::add-matcher::${{ runner.tool_cache }}/php.json\""

      - name: "Set up problem matchers for phpunit/phpunit"
        run: "echo \"::add-matcher::${{ runner.tool_cache }}/phpunit.json\""

      - name: "Get composer cache directory"
        id: "composer-cache"
        run: "echo \"dir=$(composer config cache-dir)\" >> $GITHUB_OUTPUT"
        continue-on-error: "${{ matrix.experimental }}"

      - name: "Cache composer dependencies"
        uses: "actions/cache@v6"
        with:
          path: "${{ steps.composer-cache.outputs.dir }}"
          key: "${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}"
          restore-keys: "${{ runner.os }}-composer-"
        continue-on-error: "${{ matrix.experimental }}"

      # The test job only needs PHPUnit; the analysis tooling (psalm 6 etc.) caps
      # the PHP range at 8.4 and is exercised by the dedicated analysis jobs instead.
      - name: "Remove analysis-only dev tools"
        run: "composer remove --dev --no-update vimeo/psalm psalm/plugin-phpunit rector/rector ergebnis/php-cs-fixer-config ergebnis/composer-normalize ergebnis/license"

      - name: "Install dependencies"
        run: "composer ${{ matrix.composer-param }}"
        continue-on-error: "${{ matrix.experimental }}"

      - name: "Validate composer.json"
        run: "composer validate --ansi"
        continue-on-error: "${{ matrix.experimental }}"

      # Run phpunit with code coverage
      - name: "PHPUnit Tests"
        run: "vendor/bin/phpunit --colors=always --coverage-clover=coverage.clover"
        continue-on-error: "${{ matrix.experimental }}"

      - name: "Upload coverage reports to codecov.io"
        uses: "codecov/codecov-action@v4"
        with:
          token: "${{ secrets.CODECOV_TOKEN }}"
          slug: "teqneers/phpunit-stopwatch"
          files: "coverage.clover"

  coding-standards:
    name: "Coding Standards"
    runs-on: "ubuntu-latest"
    timeout-minutes: 5

    strategy:
      matrix:
        php-version: ["8.3"]
        composer-param: ["update --no-progress --prefer-dist"]
        experimental: [false]

    steps:
      - name: "Checkout"
        uses: "actions/checkout@v7"

      - name: "Lint YAML files"
        uses: "ibiqlik/action-yamllint@v3"
        with:
          config_file: ".yamllint.yaml"
          file_or_dir: "."
          strict: true

      - name: "Setup PHP"
        uses: "shivammathur/setup-php@v2"
        with:
          php-version: "${{ matrix.php-version }}"
          tools: "composer:v2"
          coverage: "none"

      - name: "Set up problem matchers for PHP"
        run: "echo \"::add-matcher::${{ runner.tool_cache }}/php.json\""

      - name: "Get composer cache directory"
        id: "composer-cache"
        run: "echo \"dir=$(composer config cache-dir)\" >> $GITHUB_OUTPUT"
        continue-on-error: "${{ matrix.experimental }}"

      - name: "Cache composer dependencies"
        uses: "actions/cache@v6"
        with:
          path: "${{ steps.composer-cache.outputs.dir }}"
          key: "${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}"
          restore-keys: "${{ runner.os }}-composer-"
        continue-on-error: "${{ matrix.experimental }}"

      - name: "Install dependencies"
        run: "composer ${{ matrix.composer-param }}"
        continue-on-error: "${{ matrix.experimental }}"

      - name: "Run ergebnis/composer-normalize"
        run: "composer normalize --ansi --dry-run"

      - name: "Cache cache directory for friendsofphp/php-cs-fixer"
        uses: "actions/cache@v6"
        with:
          path: ".build/php-cs-fixer"
          key: "php-${{ matrix.php-version }}-php-cs-fixer-${{ github.ref_name }}"
          restore-keys: |
            php-${{ matrix.php-version }}-php-cs-fixer-main
            php-${{ matrix.php-version }}-php-cs-fixer-

      - name: "Run friendsofphp/php-cs-fixer"
        run: "vendor/bin/php-cs-fixer fix --ansi --config=.php-cs-fixer.php --diff --dry-run --show-progress=dots --verbose"

  dependency-analysis:
    name: "Dependency Analysis"
    runs-on: "ubuntu-latest"
    timeout-minutes: 5

    strategy:
      matrix:
        php-version: ["8.3"]
        composer-param: ["update --no-progress --prefer-dist"]
        experimental: [false]

    steps:
      - name: "Checkout"
        uses: "actions/checkout@v7"

      - name: "Setup PHP"
        uses: "shivammathur/setup-php@v2"
        with:
          php-version: "${{ matrix.php-version }}"
          tools: "phive"
          coverage: "none"

      - name: "Set up problem matchers for PHP"
        run: "echo \"::add-matcher::${{ runner.tool_cache }}/php.json\""

      - name: "Get composer cache directory"
        id: "composer-cache"
        run: "echo \"dir=$(composer config cache-dir)\" >> $GITHUB_OUTPUT"
        continue-on-error: "${{ matrix.experimental }}"

      - name: "Cache composer dependencies"
        uses: "actions/cache@v6"
        with:
          path: "${{ steps.composer-cache.outputs.dir }}"
          key: "${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}"
          restore-keys: "${{ runner.os }}-composer-"
        continue-on-error: "${{ matrix.experimental }}"

      - name: "Install dependencies"
        run: "composer ${{ matrix.composer-param }}"
        continue-on-error: "${{ matrix.experimental }}"

      - name: "Create phive home directory"
        run: "mkdir -p .build/phive"
        shell: "bash"

      - name: "Cache dependencies installed with phive"
        uses: "actions/cache@v6"
        with:
          path: ".build/phive"
          key: "phive-hashFiles('**/phars.xml')"
          restore-keys: "phive-"

      - name: "Install dependencies with phive"
        env:
          PHIVE_HOME: ".build/phive"
        run: "phive --no-progress install --trust-gpg-keys 0x2DF45277AEF09A2F,0x033E5F8D801A2F8D"
        shell: "bash"

      - name: "Run maglnet/composer-require-checker"
        run: ".phive/composer-require-checker check --ansi --config-file=$(pwd)/composer-require-checker.json --verbose"

  refactoring:
    name: "Refactoring"
    runs-on: "ubuntu-latest"
    timeout-minutes: 5

    strategy:
      matrix:
        php-version: ["8.3"]
        composer-param: ["update --no-progress --prefer-dist"]
        experimental: [false]

    steps:
      - name: "Checkout"
        uses: "actions/checkout@v7"

      - name: "Setup PHP"
        uses: "shivammathur/setup-php@v2"
        with:
          php-version: "${{ matrix.php-version }}"
          tools: "composer:v2"
          coverage: "none"

      - name: "Set up problem matchers for PHP"
        run: "echo \"::add-matcher::${{ runner.tool_cache }}/php.json\""

      - name: "Get composer cache directory"
        id: "composer-cache"
        run: "echo \"dir=$(composer config cache-dir)\" >> $GITHUB_OUTPUT"
        continue-on-error: "${{ matrix.experimental }}"

      - name: "Cache composer dependencies"
        uses: "actions/cache@v6"
        with:
          path: "${{ steps.composer-cache.outputs.dir }}"
          key: "${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}"
          restore-keys: "${{ runner.os }}-composer-"
        continue-on-error: "${{ matrix.experimental }}"

      - name: "Install dependencies"
        run: "composer ${{ matrix.composer-param }}"
        continue-on-error: "${{ matrix.experimental }}"

      - name: "Cache directory for rector/rector"
        uses: "actions/cache@v6"
        with:
          path: ".build/rector"
          key: "php-${{ matrix.php-version }}-rector-${{ github.ref_name }}"
          restore-keys: |
            php-${{ matrix.php-version }}-rector-main
            php-${{ matrix.php-version }}-rector-

      - name: "Run automated refactoring with rector/rector"
        run: "vendor/bin/rector --ansi --config=rector.php --dry-run"

  security-analysis:
    name: "Security Analysis"
    runs-on: "ubuntu-latest"
    timeout-minutes: 5

    strategy:
      matrix:
        php-version: ["8.3"]
        composer-param: ["update --no-progress --prefer-dist"]
        experimental: [false]

    steps:
      - name: "Checkout"
        uses: "actions/checkout@v7"

      - name: "Setup PHP"
        uses: "shivammathur/setup-php@v2"
        with:
          php-version: "${{ matrix.php-version }}"
          tools: "composer:v2"
          coverage: "none"

      - name: "Set up problem matchers for PHP"
        run: "echo \"::add-matcher::${{ runner.tool_cache }}/php.json\""

      - name: "Get composer cache directory"
        id: "composer-cache"
        run: "echo \"dir=$(composer config cache-dir)\" >> $GITHUB_OUTPUT"
        continue-on-error: "${{ matrix.experimental }}"

      - name: "Cache composer dependencies"
        uses: "actions/cache@v6"
        with:
          path: "${{ steps.composer-cache.outputs.dir }}"
          key: "${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}"
          restore-keys: "${{ runner.os }}-composer-"
        continue-on-error: "${{ matrix.experimental }}"

      - name: "Install dependencies"
        run: "composer ${{ matrix.composer-param }}"
        continue-on-error: "${{ matrix.experimental }}"

      - name: "Cache directory for rector/rector"
        uses: "actions/cache@v6"
        with:
          path: ".build/rector"
          key: "php-${{ matrix.php-version }}-rector-${{ github.ref_name }}"
          restore-keys: |
            php-${{ matrix.php-version }}-rector-main
            php-${{ matrix.php-version }}-rector-

      - name: "Check installed packages for security vulnerability advisories"
        run: "composer audit --ansi"

  static-code-analysis:
    name: "Static Code Analysis"
    runs-on: "ubuntu-latest"
    timeout-minutes: 5

    strategy:
      matrix:
        php-version: ["8.3"]
        composer-param: ["update --no-progress --prefer-dist"]
        experimental: [false]

    steps:
      - name: "Checkout"
        uses: "actions/checkout@v7"

      - name: "Setup PHP"
        uses: "shivammathur/setup-php@v2"
        with:
          php-version: "${{ matrix.php-version }}"
          tools: "composer:v2"
          coverage: "none"

      - name: "Set up problem matchers for PHP"
        run: "echo \"::add-matcher::${{ runner.tool_cache }}/php.json\""

      - name: "Get composer cache directory"
        id: "composer-cache"
        run: "echo \"dir=$(composer config cache-dir)\" >> $GITHUB_OUTPUT"
        continue-on-error: "${{ matrix.experimental }}"

      - name: "Cache composer dependencies"
        uses: "actions/cache@v6"
        with:
          path: "${{ steps.composer-cache.outputs.dir }}"
          key: "${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}"
          restore-keys: "${{ runner.os }}-composer-"
        continue-on-error: "${{ matrix.experimental }}"

      - name: "Install dependencies"
        run: "composer ${{ matrix.composer-param }}"
        continue-on-error: "${{ matrix.experimental }}"

      - name: "Cache directory for rector/rector"
        uses: "actions/cache@v6"
        with:
          path: ".build/rector"
          key: "php-${{ matrix.php-version }}-rector-${{ github.ref_name }}"
          restore-keys: |
            php-${{ matrix.php-version }}-rector-main
            php-${{ matrix.php-version }}-rector-

      - name: "Run vimeo/psalm"
        run: "vendor/bin/psalm --config=psalm.xml --output-format=github --shepherd --show-info=false --stats --threads=4"

  phar:
    name: "PHAR"
    runs-on: "ubuntu-latest"
    timeout-minutes: 10

    strategy:
      matrix:
        # humbug/box 4.6 fatals on PHP 8.4+ (its bundled symfony/console), so build on 8.3.
        php-version: ["8.3"]

    steps:
      - name: "Checkout"
        uses: "actions/checkout@v7"

      - name: "Setup PHP"
        uses: "shivammathur/setup-php@v2"
        with:
          php-version: "${{ matrix.php-version }}"
          tools: "composer:v2, phive"
          coverage: "none"

      - name: "Set up problem matchers for PHP"
        run: "echo \"::add-matcher::${{ runner.tool_cache }}/php.json\""

      - name: "Get composer cache directory"
        id: "composer-cache"
        run: "echo \"dir=$(composer config cache-dir)\" >> $GITHUB_OUTPUT"

      - name: "Cache composer dependencies"
        uses: "actions/cache@v6"
        with:
          path: "${{ steps.composer-cache.outputs.dir }}"
          key: "${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}"
          restore-keys: "${{ runner.os }}-composer-"

      - name: "Install dependencies"
        run: "composer install --no-progress"

      - name: "Create phive home directory"
        run: "mkdir -p .build/phive"
        shell: "bash"

      - name: "Cache dependencies installed with phive"
        uses: "actions/cache@v6"
        with:
          path: ".build/phive"
          key: "phive-${{ hashFiles('**/phars.xml') }}"
          restore-keys: "phive-"

      - name: "Install dependencies with phive"
        env:
          PHIVE_HOME: ".build/phive"
        run: "phive --no-progress install --trust-gpg-keys 0x2DF45277AEF09A2F,0x033E5F8D801A2F8D"
        shell: "bash"

      - name: "Build the PHAR (phpunit is provided by the host, not bundled)"
        run: |
          .phive/box validate box.json
          composer remove --no-interaction --no-scripts phpunit/phpunit
          .phive/box compile --config=box.json
          .phive/box info .build/phar/phpunit-stopwatch.phar --list

      - name: "Verify the PHAR does not bundle phpunit/phpunit"
        run: "test \"$(.phive/box info .build/phar/phpunit-stopwatch.phar --list | grep -c 'phpunit/phpunit')\" -eq 0"

  mutation-testing:
    name: "Mutation Testing"
    runs-on: "ubuntu-latest"
    timeout-minutes: 10

    strategy:
      matrix:
        php-version: ["8.3"]

    steps:
      - name: "Checkout"
        uses: "actions/checkout@v7"

      - name: "Setup PHP"
        uses: "shivammathur/setup-php@v2"
        with:
          php-version: "${{ matrix.php-version }}"
          tools: "composer:v2"
          coverage: "pcov"

      - name: "Get composer cache directory"
        id: "composer-cache"
        run: "echo \"dir=$(composer config cache-dir)\" >> $GITHUB_OUTPUT"

      - name: "Cache composer dependencies"
        uses: "actions/cache@v6"
        with:
          path: "${{ steps.composer-cache.outputs.dir }}"
          key: "${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}"
          restore-keys: "${{ runner.os }}-composer-"

      # Infection ships its own php-parser; dropping the analysis tools keeps their
      # php-parser out of the project autoload so it cannot shadow infection's.
      - name: "Remove analysis-only dev tools"
        run: "composer remove --dev --no-update vimeo/psalm psalm/plugin-phpunit rector/rector ergebnis/php-cs-fixer-config ergebnis/composer-normalize ergebnis/license"

      - name: "Install dependencies"
        run: "composer update --no-progress --prefer-dist"

      - name: "Download infection"
        run: "curl -Ls --create-dirs -o .build/infection.phar https://github.com/infection/infection/releases/latest/download/infection.phar"

      - name: "Run mutation testing"
        run: "php .build/infection.phar --threads=max --min-covered-msi=95 --no-progress --test-framework-options='--exclude-group=e2e'"

# vim: syntax=yaml ts=2 sw=2 et sr softtabstop=2 autoindent
